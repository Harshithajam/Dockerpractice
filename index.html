<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom & Petal · Flower Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #fefaf5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    /* main container */
    .shop {
      max-width: 1200px;
      width: 100%;
    }

    /* header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #4a2e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header h1 span {
      font-size: 2.5rem;
    }

    .header p {
      color: #8b6b5e;
      font-size: 1.1rem;
      margin-top: 0.3rem;
      border-bottom: 1px dashed #e6d6cf;
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    /* cart summary bar */
    .cart-bar {
      background: #fff6f0;
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      box-shadow: 0 6px 14px rgba(180, 130, 110, 0.08);
      border: 1px solid #f0dfd6;
    }

    .cart-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      color: #4f3a33;
      font-weight: 500;
    }

    .cart-icon {
      background: #ffe3d3;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .total-price {
      background: #4a2e2a;
      color: #ffefd9;
      padding: 0.4rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    /* flower grid */
    .flower-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem 1.5rem;
      margin-bottom: 2.5rem;
    }

    /* card */
    .flower-card {
      background: white;
      border-radius: 32px;
      padding: 1.8rem 1rem 1.5rem;
      box-shadow: 0 15px 25px -8px rgba(150, 110, 90, 0.12);
      transition: all 0.2s ease;
      border: 1px solid #f5e4db;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .flower-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 30px -12px rgba(150, 110, 90, 0.2);
      border-color: #eccfc1;
    }

    .flower-emoji {
      font-size: 4.8rem;
      line-height: 1;
      margin-bottom: 0.4rem;
      filter: drop-shadow(2px 6px 8px rgba(170, 120, 100, 0.2));
      transition: transform 0.2s;
    }

    .flower-card:hover .flower-emoji {
      transform: scale(1.05);
    }

    .flower-name {
      font-size: 1.7rem;
      font-weight: 500;
      color: #422e29;
      margin: 0.5rem 0 0.15rem;
      letter-spacing: -0.5px;
    }

    .flower-desc {
      color: #a58376;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .flower-price {
      font-size: 1.6rem;
      font-weight: 600;
      color: #b35e3c;
      background: #fff2e9;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 1.3rem;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      margin-top: 0.2rem;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      background: #ffe8dc;
      color: #4a2e2a;
      font-weight: 600;
      font-size: 1.1rem;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 3px 8px rgba(180, 130, 110, 0.15);
      line-height: 1;
      user-select: none;
      border: 1px solid #f0d9cd;
    }

    .btn:hover {
      background: #f7d5c4;
      transform: scale(1.02);
    }

    .btn:active {
      transform: scale(0.96);
      background: #efc4b0;
    }

    .btn.add-to-cart {
      background: #c28e72;
      color: white;
      width: auto;
      padding: 0 1.5rem;
      font-size: 1rem;
      height: 2.8rem;
      border: none;
      box-shadow: 0 5px 10px rgba(160, 100, 70, 0.3);
      letter-spacing: 0.3px;
    }

    .btn.add-to-cart:hover {
      background: #a9755b;
    }

    .quantity-badge {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4a2e2a;
      min-width: 2rem;
      text-align: center;
    }

    /* reset button */
    .reset-area {
      display: flex;
      justify-content: center;
      margin-top: 2rem;
    }

    .reset-btn {
      background: transparent;
      border: 2px solid #e2cdc2;
      color: #7b5d50;
      padding: 0.7rem 2.2rem;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fffdfb;
    }

    .reset-btn:hover {
      background: #f7ede7;
      border-color: #b99b8b;
      color: #4a2e2a;
    }

    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #bb9b8c;
      text-align: center;
    }

    /* toast message */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #3e2b26;
      color: #ffefe4;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      font-weight: 500;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 100;
      font-size: 1rem;
      letter-spacing: 0.3px;
      border: 1px solid #876b5d;
    }

    .toast.show {
      opacity: 1;
    }

    /* empty state */
    .empty-cart-msg {
      font-size: 0.95rem;
      color: #c2a392;
    }

    /* responsive */
    @media (max-width: 600px) {
      .header h1 {
        font-size: 2.2rem;
      }
      .cart-bar {
        padding: 0.7rem 1.2rem;
      }
      .total-price {
        font-size: 1rem;
        padding: 0.3rem 1rem;
      }
    }
  </style>
</head>
<body>

<div class="shop">
  <!-- header -->
  <div class="header">
    <h1>
      <span>🌸</span> Bloom & Petal <span>🌸</span>
    </h1>
    <p>fresh flowers, hand‑tied with love</p>
  </div>

  <!-- interactive cart bar -->
  <div class="cart-bar">
    <div class="cart-info">
      <div class="cart-icon">🛒</div>
      <span id="cartCountDisplay">0 items</span>
    </div>
    <div class="total-price" id="totalPriceDisplay">$0.00</div>
  </div>

  <!-- flower grid injected by JS -->
  <div class="flower-grid" id="flowerGrid"></div>

  <!-- reset / clear cart -->
  <div class="reset-area">
    <button class="reset-btn" id="resetButton">
      <span>🧹</span> clear cart
    </button>
  </div>

  <div class="footer-note">
    🌿 every stem has a story — click + to add to basket
  </div>
</div>

<!-- toast notification -->
<div id="toast" class="toast">🌸 added to cart</div>

<script>
  (function() {
    // ---------- FLOWER CATALOG ----------
    const flowers = [
      { id: 'rose', name: 'Rose', emoji: '🌹', price: 12.99, desc: 'romantic & timeless' },
      { id: 'tulip', name: 'Tulip', emoji: '🌷', price: 9.50, desc: 'spring elegance' },
      { id: 'sunflower', name: 'Sunflower', emoji: '🌻', price: 8.75, desc: 'radiant & cheerful' },
      { id: 'daisy', name: 'Daisy', emoji: '🌼', price: 6.25, desc: 'pure & simple' },
      { id: 'lavender', name: 'Lavender', emoji: '💜', price: 11.40, desc: 'calm & fragrant' },
      { id: 'cherry', name: 'Cherry Blossom', emoji: '🌸', price: 14.20, desc: 'delicate spring' },
      { id: 'hibiscus', name: 'Hibiscus', emoji: '🌺', price: 10.30, desc: 'tropical vibes' },
      { id: 'bouquet', name: 'Mixed Bouquet', emoji: '💐', price: 24.99, desc: 'assorted seasonal' }
    ];

    // ---------- CART STATE ----------
    // each item: { id, name, price, quantity }
    let cart = [];

    // ---------- DOM ELEMENTS ----------
    const grid = document.getElementById('flowerGrid');
    const cartCountDisplay = document.getElementById('cartCountDisplay');
    const totalPriceDisplay = document.getElementById('totalPriceDisplay');
    const resetButton = document.getElementById('resetButton');
    const toastEl = document.getElementById('toast');

    // ---------- UTILITIES ----------
    // show toast message, auto hide after 1.8 sec
    let toastTimer = null;
    function showToast(message = '🌸 added to cart') {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 1800);
    }

    // format price
    function formatPrice(value) {
      return '$' + value.toFixed(2);
    }

    // ---------- RENDER FLOWER CARDS ----------
    function renderFlowerCards() {
      grid.innerHTML = ''; // clear

      flowers.forEach(flower => {
        const card = document.createElement('div');
        card.className = 'flower-card';
        card.dataset.id = flower.id;

        // emoji
        const emojiDiv = document.createElement('div');
        emojiDiv.className = 'flower-emoji';
        emojiDiv.textContent = flower.emoji;

        // name
        const nameDiv = document.createElement('div');
        nameDiv.className = 'flower-name';
        nameDiv.textContent = flower.name;

        // description
        const descDiv = document.createElement('div');
        descDiv.className = 'flower-desc';
        descDiv.textContent = flower.desc;

        // price
        const priceDiv = document.createElement('div');
        priceDiv.className = 'flower-price';
        priceDiv.textContent = formatPrice(flower.price);

        // actions container
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'card-actions';

        // quantity badge (dynamic)
        const qtySpan = document.createElement('span');
        qtySpan.className = 'quantity-badge';
        qtySpan.dataset.flowerId = flower.id;
        qtySpan.textContent = '0';   // will be updated by updateQuantityBadges

        // add to cart button
        const addBtn = document.createElement('button');
        addBtn.className = 'btn add-to-cart';
        addBtn.textContent = 'add +';
        addBtn.dataset.addId = flower.id;

        // append elements
        actionsDiv.appendChild(qtySpan);
        actionsDiv.appendChild(addBtn);

        card.appendChild(emojiDiv);
        card.appendChild(nameDiv);
        card.appendChild(descDiv);
        card.appendChild(priceDiv);
        card.appendChild(actionsDiv);

        grid.appendChild(card);
      });

      // sync quantity badges after render
      updateQuantityBadges();
    }

    // ---------- UPDATE QUANTITY BADGES (for each card) ----------
    function updateQuantityBadges() {
      // for each flower id, find quantity in cart and set badge
      flowers.forEach(flower => {
        const badge = document.querySelector(`.quantity-badge[data-flower-id="${flower.id}"]`);
        if (!badge) return;
        const cartItem = cart.find(item => item.id === flower.id);
        const qty = cartItem ? cartItem.quantity : 0;
        badge.textContent = qty;
      });
    }

    // ---------- UPDATE CART SUMMARY (count & total) ----------
    function updateCartSummary() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartCountDisplay.textContent = totalItems === 1 ? '1 item' : `${totalItems} items`;
      totalPriceDisplay.textContent = formatPrice(totalPrice);
    }

    // ---------- ADD TO CART (by flower id) ----------
    function addToCart(flowerId) {
      const flower = flowers.find(f => f.id === flowerId);
      if (!flower) return;

      const existing = cart.find(item => item.id === flowerId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: flower.id,
          name: flower.name,
          price: flower.price,
          quantity: 1
        });
      }

      // refresh UI
      updateQuantityBadges();
      updateCartSummary();
      showToast(`🌸 ${flower.name} added to cart`);
    }

    // ---------- EVENT DELEGATION: handle clicks on add buttons ----------
    function handleGridClick(e) {
      const addBtn = e.target.closest('.btn.add-to-cart');
      if (!addBtn) return;
      const flowerId = addBtn.dataset.addId;
      if (flowerId) {
        addToCart(flowerId);
      }
    }

    // ---------- CLEAR CART (reset) ----------
    function clearCart() {
      if (cart.length === 0) {
        showToast('🛒 cart is already empty');
        return;
      }
      cart = [];
      updateQuantityBadges();
      updateCartSummary();
      showToast('🧺 cart cleared');
    }

    // ---------- INITIAL RENDER & BINDINGS ----------
    function init() {
      renderFlowerCards();
      updateCartSummary();  // sets 0 items / $0.00

      // add click listener to grid (event delegation)
      grid.addEventListener('click', handleGridClick);

      // reset button
      resetButton.addEventListener('click', clearCart);
    }

    // start the app
    init();
  })();
</script>
</body>
</html>
