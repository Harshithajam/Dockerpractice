<body>

<header>
    <h1>🌿 Green Haven</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#plants">Plants</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Bring Nature Home 🌱</h2>
    <p>Beautiful plants delivered right to your doorstep.</p>
    <button onclick="scrollToPlants()">Shop Plants</button>
</section>

<section class="controls">
    <input
        type="text"
        id="search"
        placeholder="Search plants..."
        oninput="filterPlants()"
    >

    <select id="category" onchange="filterPlants()">
        <option value="all">All Categories</option>
        <option value="indoor">Indoor</option>
        <option value="outdoor">Outdoor</option>
        <option value="flowering">Flowering</option>
    </select>
</section>

<section class="products" id="plants">
    <h2>Our Plants</h2>

    <div class="product-grid" id="productGrid"></div>
</section>

<div class="cart" id="cart">
    <h3>🛒 Your Cart</h3>

    <div id="cartItems"></div>

    <strong>Total: ₹<span id="cartTotal">0</span></strong>

    <button onclick="checkout()">Checkout</button>
</div>

<footer id="contact">
    <p>© 2026 Green Haven | Grow Something Beautiful 🌱</p>
</footer>

<script>

const plants = [
    {
        name: "Snake Plant",
        category: "indoor",
        price: 499,
        image: "🌿"
    },
    {
        name: "Peace Lily",
        category: "indoor",
        price: 599,
        image: "🌱"
    },
    {
        name: "Rose Plant",
        category: "flowering",
        price: 399,
        image: "🌹"
    },
    {
        name: "Aloe Vera",
        category: "indoor",
        price: 299,
        image: "🪴"
    },
    {
        name: "Marigold",
        category: "flowering",
        price: 249,
        image: "🌼"
    },
    {
        name: "Areca Palm",
        category: "outdoor",
        price: 699,
        image: "🌴"
    }
];

let cart = [];

function displayPlants(list = plants) {

    const grid = document.getElementById("productGrid");

    grid.innerHTML = "";

    list.forEach((plant, index) => {

        grid.innerHTML += `
            <div class="card">

                <div class="plant-image">
                    ${plant.image}
                </div>

                <div class="card-content">

                    <h3>${plant.name}</h3>

                    <p class="category">
                        ${plant.category}
                    </p>

                    <p class="price">
                        ₹${plant.price}
                    </p>

                    <button
                        class="add-btn"
                        onclick="addToCart(${index})">
                        Add to Cart
                    </button>

                </div>

            </div>
        `;
    });
}

function filterPlants() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const category =
        document.getElementById("category")
        .value;

    const filtered = plants.filter(plant => {

        const matchesSearch =
            plant.name.toLowerCase().includes(search);

        const matchesCategory =
            category === "all" ||
            plant.category === category;

        return matchesSearch && matchesCategory;
    });

    displayPlants(filtered);
}

function addToCart(index) {

    const plant = plants[index];

    cart.push(plant);

    updateCart();

    document.getElementById("cart").style.display = "block";
}

function updateCart() {

    const cartItems =
        document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {

        total += item.price;

        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name}</span>

                <span>
                    ₹${item.price}
                    <button
                        onclick="removeFromCart(${index})"
                        style="width:auto;margin:0;padding:3px 7px;">
                        ×
                    </button>
                </span>
            </div>
        `;
    });

    document.getElementById("cartTotal").textContent = total;
}

function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();

    if (cart.length === 0) {
        document.getElementById("cart").style.display = "none";
    }
}

function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert(
        "Thank you for your purchase! 🌱"
    );

    cart = [];

    updateCart();

    document.getElementById("cart").style.display = "none";
}

function scrollToPlants() {

    document
        .getElementById("plants")
        .scrollIntoView({
            behavior: "smooth"
        });
}

displayPlants();

</script>

</body>
</html>
